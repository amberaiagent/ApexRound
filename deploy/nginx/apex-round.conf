server {
    listen 80;
    listen [::]:80;
    server_name apex-round.com www.apex-round.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        return 301 https://apex-round.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.apex-round.com;
    ssl_certificate /etc/letsencrypt/live/apex-round.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apex-round.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://apex-round.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apex-round.com;
    root /var/www/apex/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/apex-round.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apex-round.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
